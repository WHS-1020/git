<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>趋势 - 轧机监控平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <div class="page-title" id="page-title">历史趋势</div>
        <div class="right"><span id="clock">--</span></div>
      </div>
      <div class="content">
        <div class="panel">
          <div class="panel-head">
            <div class="filters">
              <span class="muted small">时间范围：</span>
              <button class="btn sm" data-range="3600" onclick="setRange(3600)">最近 1 小时</button>
              <button class="btn sm" data-range="28800" onclick="setRange(28800)">最近 8 小时</button>
              <button class="btn sm" data-range="86400" onclick="setRange(86400)">最近 24 小时</button>
              <button class="btn sm" data-range="604800" onclick="setRange(604800)">最近 7 天</button>
              <button class="btn sm primary" onclick="loadTrend()">刷新</button>
              <button class="btn sm" onclick="exportCsv()">导出 CSV</button>
            </div>
          </div>
          <div class="panel-body">
            <div class="mb-12" id="point-picker"><div class="empty">加载测点中…</div></div>
            <div class="chart-box" id="trend-chart"></div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>数据明细</h3><span class="muted small" id="table-info"></span></div>
          <div class="panel-body">
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>时间</th><th>设备</th><th>测点</th><th>数值</th><th>状态</th></tr></thead>
              <tbody id="trend-tbody"><tr><td colspan="5" class="empty">请选择测点后查询</td></tr></tbody>
            </table></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-box"></div>
  <script src="lib/echarts/echarts.min.js"></script>
  <script src="lib/signalr/signalr.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/trends.js"></script>
</body>
</html>
